<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ThreatLens • Ocular Security</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-section">
            <div class="logo">
                <img src="../icons/icon32.png" alt="Sharingan Eye" class="sharingan-icon-spin">
            </div>
            <div>
                <h1>ThreatLens</h1>
                <span class="subtitle">OCULAR WEB SECURITY</span>
            </div>
        </div>

        <div class="protection-status">
            <span class="status-pulse-dot"></span> ACTIVE
        </div>
    </div>

    <!-- Current URL -->
    <div class="url-section">
        <span class="label">CURRENT WEBSITE TARGET</span>
        <div id="currentUrl" class="url">Loading...</div>
    </div>

    <!-- Security Status -->
    <div id="riskBox" class="risk-box">
        <div id="riskIcon" class="risk-icon">🟢</div>
        <div>
            <div class="label">THREAT PERCEPTION</div>
            <div id="riskLevel" class="risk-level">SAFE</div>
        </div>
    </div>

    <!-- Threat Indicators -->
    <div class="findings">
        <div class="finding-row">
            <span>Website Threat Indicators</span>
            <strong id="websiteFindings">0</strong>
        </div>
        <div class="finding-row">
            <span>Extension Findings</span>
            <strong id="extensionFindings">0</strong>
        </div>
    </div>

    <!-- Protection Engine Status -->
    <div class="settings-info">
        <div class="info-row">
            <span>AI Neural Analysis</span>
            <span id="aiStatus" class="enabled">ON</span>
        </div>
        <div class="info-row">
            <span>Yata Shield (Privacy Mode)</span>
            <span id="privacyStatus" class="enabled">ON</span>
        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button id="detailsBtn" class="primary-btn">
            <span>Open Investigation Terminal</span> <span class="arrow">&rarr;</span>
        </button>
    </div>

    <script src="popup.js"></script>

</body>

</html>
